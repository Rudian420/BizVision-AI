name: CI · Backend

on:
  push:
    branches: [main, develop]
    paths: ['backend/**', 'pyproject.toml', '.github/workflows/ci-backend.yml']
  pull_request:
    paths: ['backend/**', 'pyproject.toml', '.github/workflows/ci-backend.yml']

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: Lint · Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dev tooling
        run: pip install -r backend/requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check backend/src backend/tests
      - name: Ruff (format check)
        run: ruff format --check backend/src backend/tests
      - name: Mypy (types)
        run: mypy backend/src --config-file pyproject.toml

  test:
    name: Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bizvision
          POSTGRES_PASSWORD: bizvision123
          POSTGRES_DB: bizvision_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bizvision"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://bizvision:bizvision123@localhost:5432/bizvision_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test-secret-key-not-for-production-use-only
      ENVIRONMENT: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy[asyncio] \
            asyncpg "python-jose[cryptography]" "passlib[bcrypt]" redis celery orjson \
            email-validator python-multipart loguru
      - name: Run tests
        run: pytest tests/ -m "not slow" --cov=src --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
