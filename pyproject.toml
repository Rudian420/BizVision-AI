# ============================================================
# BizVision AI — Python Tooling Configuration (monorepo root)
# Applies to: backend/src, backend/tests, ml/
# Tools: ruff (lint+format), mypy (types), pytest (tests)
# ============================================================

[tool.ruff]
line-length = 100
# py310 floor: code runs on the dev machine (3.10) AND the 3.11 Docker image.
target-version = "py310"
src = ["backend", "ml"]
extend-exclude = [
    "backend/alembic/versions",
    ".venv",
    "**/__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ASYNC",# flake8-async
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "N805",   # pydantic validators use cls
    "RUF001", # ambiguous unicode (×, —) is intentional in docstrings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"backend/tests/*" = ["S101"]
# ML/research code follows scientific conventions (X/y matrices) and contains
# Phase-3 scaffolds; relax naming + a few style rules there.
"ml/**" = ["N803", "N806", "RUF012", "SIM108", "UP038", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["src", "ml"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = [
    "backend/alembic/",
    "\\.venv",
    "build/",
]

[[tool.mypy.overrides]]
module = ["ml.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: requires running services (db/redis)",
]

[tool.coverage.run]
source = ["backend/src", "ml"]
omit = ["*/tests/*", "*/alembic/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
