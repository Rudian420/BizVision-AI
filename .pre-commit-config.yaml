# BizVision AI — pre-commit hooks
# Install: pip install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.1
    hooks:
      - id: ruff
        name: ruff (lint backend + ml)
        args: [--fix]
        files: ^(backend|ml)/.*\.py$
      - id: ruff-format
        name: ruff (format backend + ml)
        files: ^(backend|ml)/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        name: mypy (backend types)
        files: ^backend/src/.*\.py$
        additional_dependencies: [pydantic>=2.7, types-redis]
        args: [--config-file=pyproject.toml]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: prettier (frontend + contracts)
        files: ^(frontend|packages)/.*\.(ts|tsx|js|jsx|json|css)$
        additional_dependencies:
          - prettier@3.3.2
          - prettier-plugin-tailwindcss@0.6.5
