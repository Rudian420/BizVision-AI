# BizVision AI — Prometheus scrape configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: bizvision-ai

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: bizvision-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: backend

  # Celery exporter / Flower can be added here in Phase 5.
