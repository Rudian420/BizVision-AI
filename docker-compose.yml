version: '3.9'

# ============================================================
# BizVision AI — Full Stack Docker Compose
# Services: Frontend, Backend, PostgreSQL+pgvector, Redis,
#           Celery, Flower, MLflow, MinIO, Nginx
# ============================================================

networks:
  bizvision-net:
    driver: bridge
    name: bizvision-net

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mlflow-data:
  model-cache:
  huggingface-cache:
  prometheus-data:
  grafana-data:

services:

  # ─────────────────────────────────────────────
  # NGINX — Reverse Proxy
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: bizvision-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - bizvision-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # FRONTEND — Next.js 14
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: ${NODE_ENV:-development}
    container_name: bizvision-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      # NEXT_PUBLIC_* env vars are inlined into the JS bundle at build
      # time and run in the BROWSER, not inside the container. The
      # browser executes on the Windows host and cannot resolve the
      # docker-internal hostname `backend` — so the URLs must point at
      # `localhost` (the host-side port mapping for the backend
      # container's 8000).
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/v1
    working_dir: /app/frontend
    volumes:
      # Mount the whole monorepo so the frontend can reach workspace
      # packages (packages/contracts) at runtime for hot reload.
      - .:/app
      # Anonymous volumes shield the in-image installed deps and the
      # .next cache from being clobbered by the bind mount above.
      - /app/node_modules
      - /app/frontend/.next
    depends_on:
      - backend
    networks:
      - bizvision-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────
  # BACKEND — FastAPI
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${PYTHON_ENV:-development}
    container_name: bizvision-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://bizvision:${POSTGRES_PASSWORD:-bizvision123}@postgres:5432/bizvision
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-in-production-32-chars}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - PRICING_USE_REAL_ML=${PRICING_USE_REAL_ML:-true}
      - FORECASTING_USE_REAL_ML=${FORECASTING_USE_REAL_ML:-true}
      - SUSTAINABILITY_USE_REAL_ML=${SUSTAINABILITY_USE_REAL_ML:-true}
      - RECRUITMENT_USE_REAL_ML=${RECRUITMENT_USE_REAL_ML:-true}
      - CHATBOT_USE_REAL_ML=${CHATBOT_USE_REAL_ML:-false}
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_DOWNLOAD_TIMEOUT=300
      - TRANSFORMERS_OFFLINE=0
      - BIZVISION_SKIP_MLFLOW=${BIZVISION_SKIP_MLFLOW:-1}
    volumes:
      - ./backend:/app
      - ./ml:/app/ml
      - model-cache:/app/model_cache
      - huggingface-cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bizvision-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────
  # CELERY WORKER — Background ML Tasks
  # ─────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${PYTHON_ENV:-development}
    container_name: bizvision-celery-worker
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=4 -Q ml,default
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://bizvision:${POSTGRES_PASSWORD:-bizvision123}@postgres:5432/bizvision
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_DOWNLOAD_TIMEOUT=300
      - BIZVISION_SKIP_MLFLOW=${BIZVISION_SKIP_MLFLOW:-1}
    volumes:
      - ./backend:/app
      - ./ml:/app/ml
      - model-cache:/app/model_cache
      - huggingface-cache:/root/.cache/huggingface
    depends_on:
      - redis
      - postgres
    networks:
      - bizvision-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # CELERY BEAT — Scheduled Tasks
  # ─────────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${PYTHON_ENV:-development}
    container_name: bizvision-celery-beat
    command: celery -A src.workers.celery_app beat --loglevel=info
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    networks:
      - bizvision-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # FLOWER — Celery Monitoring
  # ─────────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: bizvision-flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin123}
    depends_on:
      - redis
    networks:
      - bizvision-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # POSTGRESQL + pgvector
  # ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bizvision-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=bizvision
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bizvision123}
      - POSTGRES_DB=bizvision
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - bizvision-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizvision -d bizvision"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # REDIS — Cache + Message Broker
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bizvision-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - bizvision-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # MLFLOW — Experiment Tracking
  # ─────────────────────────────────────────────
  # ─────────────────────────────────────────────
  # MINIO-INIT — One-shot bucket bootstrap
  # ─────────────────────────────────────────────
  # MinIO doesn't auto-create buckets, and MLflow's
  # `--default-artifact-root s3://mlflow-artifacts` will tank the
  # tracking server on the first artifact write attempt if the
  # bucket doesn't exist. This one-shot uses the official `mc`
  # client to create the bucket idempotently, then exits.
  # TASK-051 — closes the chronic-restart loop's bucket leg.
  minio-init:
    image: minio/mc:RELEASE.2024-01-05T05-04-32Z
    container_name: bizvision-minio-init
    depends_on:
      minio:
        condition: service_started
    networks:
      - bizvision-net
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        # Wait for MinIO to accept connections (short loop — `minio`
        # advertises ready before its first health check passes).
        for i in $$(seq 1 30); do
          mc alias set local http://minio:9000 \
            "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" && break
          sleep 1
        done
        mc mb --ignore-existing local/mlflow-artifacts
        mc anonymous set download local/mlflow-artifacts || true
        echo "minio-init: mlflow-artifacts bucket ready."
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: bizvision-mlflow
    ports:
      - "5000:5000"
    # TASK-051 — the official MLflow image ships without
    # psycopg2-binary (Postgres backend store) or boto3 (S3 artifact
    # root). The chronic-restart loop the project saw for weeks was
    # MLflow's CLI raising `ModuleNotFoundError: No module named
    # 'psycopg2'` on every container start, then docker restarting
    # it under the `restart: unless-stopped` policy. Installing both
    # at startup is the lightest fix that doesn't require a custom
    # image. The install is cached in the writable image layer so
    # subsequent restarts skip the network hop.
    command: >
      sh -c "pip install --quiet --no-cache-dir 'psycopg2-binary==2.9.9' 'boto3==1.34.69' &&
      mlflow server
      --backend-store-uri postgresql://bizvision:${POSTGRES_PASSWORD:-bizvision123}@postgres:5432/bizvision_mlflow
      --default-artifact-root s3://mlflow-artifacts
      --host 0.0.0.0
      --port 5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY:-minioadmin123}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks:
      - bizvision-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ─────────────────────────────────────────────
  # MINIO — S3-Compatible Object Storage
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: bizvision-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio-data:/data
    networks:
      - bizvision-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────
  # ML-DEV — Jupyter Lab + training environment
  # Start with:  docker compose --profile ml up -d ml-dev
  # ─────────────────────────────────────────────
  ml-dev:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: bizvision-ml-dev
    profiles: ["ml"]
    ports:
      - "8888:8888"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT_PREFIX=bizvision
      - MINIO_ENDPOINT=minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    volumes:
      - ./ml:/app
      - model-cache:/app/model_cache
    depends_on:
      - mlflow
    networks:
      - bizvision-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # PROMETHEUS — metrics scraping  (profile: monitoring)
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: bizvision-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_DAYS:-15}d"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - bizvision-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # GRAFANA — dashboards  (profile: monitoring)
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: bizvision-grafana
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - bizvision-net
    restart: unless-stopped
